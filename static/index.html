<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Scanner Web Interface</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #00e676; margin-bottom: 20px; }
        input { padding: 12px; width: 350px; border: none; border-radius: 5px; background: #333; color: white; font-size: 16px; margin-bottom: 20px; outline: none; }
        button { padding: 12px 25px; background: #00e676; color: #121212; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00c853; transform: scale(1.05); }
        .loader { display: none; margin-top: 20px; border: 4px solid #333; border-top: 4px solid #00e676; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-left: auto; margin-right: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p#msg { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Website Port Scanner</h1>
        <p>Hệ thống quét cổng & xuất báo cáo Excel</p>
        <input type="text" id="urlInput" placeholder="Nhập domain (ví dụ: google.com)">
        <br>
        <button onclick="startScan()">BẮT ĐẦU QUÉT & TẢI FILE</button>
        <div id="loader" class="loader"></div>
        <p id="msg"></p>
    </div>

    <script>
        function startScan() {
            const url = document.getElementById('urlInput').value;
            if (!url) { alert("Vui lòng nhập domain!"); return; }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('msg').innerText = "Đang tiến hành quét toàn bộ cổng... Quá trình này có thể mất 1-2 phút.";
            
            // Gọi link scan
            window.location.href = `/scan?url=${url}`;
            
            // Giả lập trạng thái chờ
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('msg').innerText = "Nếu file chưa tự tải xuống, vui lòng kiểm tra lại URL.";
            }, 10000);
        }
    </script>
</body>
</html>
