[package]
name = "doancoso-main"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
rocket_dyn_templates = { version = "0.1.0", features = ["handlebars"] }
reqwest = { version = "0.11", features = ["blocking"] }
rust_xlsxwriter = "0.64.0"
colored = "2.0"
tokio = { version = "1", features = ["full"] }